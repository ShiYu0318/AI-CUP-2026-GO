[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicup2026-go"
version = "0.1.0"
description = "AI CUP 2026 圍棋棋力與風格預測競賽 —— 驗證框架與模型"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicup = ["*.cfg"]          # KataGo 分析引擎的設定（aicup.humansl）

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 需要完整 training/ 資料集或較長時間的測試",
]
